# Halcyon – import & build (with the Folia lyric visualizer)
#
# Put these files in the repository (all from the phone, nothing needs unzipping):
#   .github/workflows/build.yml          this file
#   Halcyon-main.zip                     the Halcyon source zip (any name; found by its settings.gradle.kts)
#   folia-web-min.zip                    the trimmed Folia source (any name; found by its vite.config.ts)
#   Halcyon-Folia-Visualizer-patch.zip   the patch zip(s) (any name; found by their apply.py / files/ folder)
# Zips may sit in the repository root, in source/ or in patches/.
#
# What it does on the runner (never inside your repo):
#   1. unpacks Halcyon and Folia
#   2. applies the patch zips (Kotlin code for Halcyon + a small web host for Folia)
#   3. builds Folia's real visualizer as a web bundle and bakes it into the APK's assets
#   4. builds the arm64-v8a APK (release by default) and uploads it
# If the patched app fails to compile it builds the plain app instead and prints the errors.
# If the Folia bundle fails to build, the APK still builds and uses the built-in native styles.

name: Import and Build Halcyon

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      use_patches:
        description: "Apply the patch zips (turn off to build the plain app)"
        required: true
        default: true
        type: boolean
  push:
    paths:
      - "*.zip"
      - "source/**"
      - "patches/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: halcyon-import-build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
  USE_PATCHES: ${{ github.event.inputs.use_patches || 'true' }}

jobs:
  build:
    name: Import, patch, build Folia bundle and APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository (zips + workflow only)
        uses: actions/checkout@v4

      - name: Import source zips (to build/ and folia/, not the repo root)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t ZIPS < <(printf '%s\n' ./*.zip source/*.zip patches/*.zip | sort)
          BASE_ZIP=""
          FOLIA_ZIP=""
          for z in "${ZIPS[@]}"; do
            [ -f "$z" ] || continue
            names=$(unzip -Z1 "$z" 2>/dev/null || true)
            if [ -z "$BASE_ZIP" ] && grep -qE '(^|/)settings\.gradle\.kts$' <<< "$names"; then
              BASE_ZIP="$z"; continue
            fi
            if [ -z "$FOLIA_ZIP" ] && grep -qE '(^|/)vite\.config\.ts$' <<< "$names" && grep -q 'src/components/visualizer/' <<< "$names"; then
              FOLIA_ZIP="$z"; continue
            fi
          done
          if [ -z "$BASE_ZIP" ]; then
            echo "::error::No Halcyon source zip found. Upload the Halcyon zip (it must contain settings.gradle.kts) to the repository root."
            exit 1
          fi
          echo "Halcyon source: $BASE_ZIP"
          rm -rf "$RUNNER_TEMP/base" build
          mkdir -p "$RUNNER_TEMP/base"
          unzip -q "$BASE_ZIP" -d "$RUNNER_TEMP/base"
          ROOT=$(find "$RUNNER_TEMP/base" -maxdepth 3 -name settings.gradle.kts -printf '%d %h\n' | sort -n | head -1 | cut -d' ' -f2-)
          mkdir build
          cp -a "$ROOT/." build/
          {
            echo "BASE_ROOT=$ROOT"
            echo "BASE_ZIP=$BASE_ZIP"
          } >> "$GITHUB_ENV"

          HAVE_FOLIA=false
          if [ -n "$FOLIA_ZIP" ]; then
            echo "Folia source: $FOLIA_ZIP"
            rm -rf "$RUNNER_TEMP/foliasrc" folia
            mkdir -p "$RUNNER_TEMP/foliasrc"
            unzip -q "$FOLIA_ZIP" -d "$RUNNER_TEMP/foliasrc"
            FROOT=$(find "$RUNNER_TEMP/foliasrc" -maxdepth 3 -name vite.config.ts -printf '%d %h\n' | sort -n | head -1 | cut -d' ' -f2-)
            mkdir folia
            cp -a "$FROOT/." folia/
            HAVE_FOLIA=true
          else
            echo "::warning::No Folia source zip found - the APK will only contain the built-in native styles."
          fi
          echo "HAVE_FOLIA=$HAVE_FOLIA" >> "$GITHUB_ENV"
          echo "FOLIA_ZIP=$FOLIA_ZIP" >> "$GITHUB_ENV"

      - name: Apply patch zips
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPLIED=0
          if [ "$USE_PATCHES" != "true" ]; then
            echo "Patches are switched off for this run."
          else
            mapfile -t ZIPS < <(printf '%s\n' ./*.zip source/*.zip patches/*.zip | sort)
            for p in "${ZIPS[@]}"; do
              [ -f "$p" ] || continue
              [ "$p" = "$BASE_ZIP" ] && continue
              [ -n "$FOLIA_ZIP" ] && [ "$p" = "$FOLIA_ZIP" ] && continue
              names=$(unzip -Z1 "$p" 2>/dev/null || true)
              if ! grep -qE '(^|/)apply\.py$|(^|/)files/|(^|/)folia-host/' <<< "$names"; then
                echo "Skipping $p (not a patch zip)"
                continue
              fi
              d="$RUNNER_TEMP/patch-$(basename "$p" .zip | tr ' ' '_')"
              rm -rf "$d"; mkdir -p "$d"
              unzip -q "$p" -d "$d"
              F=$(find "$d" -maxdepth 2 -type d -name files | head -1 || true)
              H=$(find "$d" -maxdepth 2 -type d -name folia-host | head -1 || true)
              A=$(find "$d" -maxdepth 2 -type f -name apply.py | head -1 || true)
              if [ -n "$F" ]; then cp -a "$F/." build/; fi
              if [ -n "$H" ] && [ "$HAVE_FOLIA" = "true" ]; then cp -a "$H/." folia/; fi
              if [ -n "$A" ]; then python3 "$A" "$PWD/build"; fi
              APPLIED=$((APPLIED + 1))
              echo "Applied patch: $p"
            done
          fi
          echo "PATCHES_APPLIED=$APPLIED" >> "$GITHUB_ENV"
          echo "Patch zips applied: $APPLIED"
          if [ "$HAVE_FOLIA" = "true" ] && [ ! -f folia/halcyon-host.html ]; then
            echo "::warning::folia/halcyon-host.html is missing (patch zip without the Folia host?). Skipping the Folia bundle."
            echo "HAVE_FOLIA=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js 24
        if: ${{ env.HAVE_FOLIA == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: folia/package-lock.json

      - name: Install Folia dependencies
        id: npm_install
        if: ${{ env.HAVE_FOLIA == 'true' }}
        continue-on-error: true
        working-directory: folia
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tail -40

      - name: Build Folia visualizer bundle (web)
        id: folia_build
        if: ${{ env.HAVE_FOLIA == 'true' && steps.npm_install.outcome == 'success' }}
        continue-on-error: true
        working-directory: folia
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          ELECTRON: "false"
        run: |
          set -euo pipefail
          npx vite build -c vite.halcyon.config.ts 2>&1 | tee ../folia-build.log | tail -60
          test -f dist-halcyon/halcyon-host.html

      - name: Bake the Folia bundle into the APK assets
        if: ${{ steps.folia_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/app/src/main/assets/folia
          cp -a folia/dist-halcyon/. build/app/src/main/assets/folia/
          du -sh build/app/src/main/assets/folia
          echo "FOLIA_BAKED=true" >> "$GITHUB_ENV"

      - name: Folia bundle status
        if: ${{ always() && env.HAVE_FOLIA == 'true' && steps.folia_build.outcome != 'success' }}
        shell: bash
        run: |
          {
            echo "## Folia bundle was not built"
            echo "The APK still builds and uses the built-in native styles. Last lines of the web build:"
            echo '```'
            tail -40 folia-build.log 2>/dev/null || echo "(no log - dependency install failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Application license provenance check
        continue-on-error: true
        working-directory: build
        run: python3 tools/check_licenses.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          if ! sdkmanager --channel=3 "platforms;android-37"; then
            echo "platforms;android-37 is unavailable from sdkmanager; using android-36 as a CI compatibility platform."
            sdkmanager "platforms;android-36"
            mkdir -p "$ANDROID_HOME/platforms/android-37"
            cp -a "$ANDROID_HOME/platforms/android-36/." "$ANDROID_HOME/platforms/android-37/"
            sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
          fi
          sdkmanager --channel=3 "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0"

      # A release APK is debug-signed here. Keeping one debug key in the Actions cache means each
      # new build can be installed over the previous one without uninstalling.
      - name: Restore signing key
        id: key_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: halcyon-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Save signing key
        if: ${{ always() && steps.key_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: halcyon-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: build

      - name: Build APK (with patches)
        id: build
        continue-on-error: true
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ALLOW_DEBUG_SIGNED_RELEASE: "true"
        run: |
          cd build
          chmod +x ./gradlew
          TASK=":app:assembleRelease"
          if [ "$BUILD_TYPE" = "debug" ]; then TASK=":app:assembleDebug"; fi
          set +e
          ./gradlew --no-daemon "$TASK" -PellaAbi=arm64-v8a --stacktrace 2>&1 | tee ../build.log
          exit "${PIPESTATUS[0]}"

      - name: Show compiler errors
        if: ${{ always() && steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo "## Build failed"
            echo "Patch zips applied: $PATCHES_APPLIED"
            echo
            echo '```'
            grep -E '^e: |error:|FAILED|What went wrong' build.log | head -60 || true
            echo '```'
            echo
            echo "The full log is attached to this run as **build-log**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fallback - build the plain app (patches failed to compile)
        id: fallback
        if: ${{ steps.build.outcome == 'failure' && env.PATCHES_APPLIED != '0' }}
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ALLOW_DEBUG_SIGNED_RELEASE: "true"
        run: |
          rm -rf build-base
          mkdir build-base
          cp -a "$BASE_ROOT/." build-base/
          cd build-base
          chmod +x ./gradlew
          TASK=":app:assembleRelease"
          if [ "$BUILD_TYPE" = "debug" ]; then TASK=":app:assembleDebug"; fi
          set +e
          ./gradlew --no-daemon "$TASK" -PellaAbi=arm64-v8a --stacktrace 2>&1 | tee ../build-base.log
          exit "${PIPESTATUS[0]}"

      - name: List APK outputs
        if: ${{ always() }}
        shell: bash
        run: |
          find build build-base -path '*outputs*' \( -name '*.apk' -o -name '*.APK' \) -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload APK (patched app)
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-visualizer-${{ env.BUILD_TYPE }}-arm64-v8a-${{ github.run_number }}
          path: |
            build/app/build/outputs/apk/release/*arm64-v8a*.apk
            build/app/build/outputs/apk/debug/*arm64-v8a*.apk
            build/app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
            build/app/build/outputs/renamed-apk/debug/*arm64-v8a*.APK
          if-no-files-found: error

      - name: Upload APK (plain fallback app)
        if: ${{ steps.fallback.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-PLAIN-fallback-${{ env.BUILD_TYPE }}-arm64-v8a-${{ github.run_number }}
          path: |
            build-base/app/build/outputs/apk/release/*arm64-v8a*.apk
            build-base/app/build/outputs/apk/debug/*arm64-v8a*.apk
            build-base/app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
            build-base/app/build/outputs/renamed-apk/debug/*arm64-v8a*.APK
          if-no-files-found: error

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build-base.log
            folia-build.log
          if-no-files-found: ignore

      - name: Mark the run as failed when the patched build did not compile
        if: ${{ steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::The patched app did not compile. A plain fallback APK was built if possible; send the errors from the run summary / build-log artifact."
          exit 1
