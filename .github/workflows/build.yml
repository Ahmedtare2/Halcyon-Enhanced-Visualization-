# Halcyon – import & build
#
# Put these files in the repository (all from the phone, nothing needs unzipping):
#   .github/workflows/build.yml     this file
#   Halcyon-main.zip                the Halcyon source zip (any name; it is found by its settings.gradle.kts)
#   Halcyon-Folia-Visualizer-patch.zip   patch zip(s) (any name; found by their apply.py / files/ folder)
# Zips may sit in the repository root, in source/ or in patches/.
#
# The workflow unpacks everything on the runner (never into the repo), applies the patch zips in
# alphabetical order, builds the arm64-v8a APK and uploads it as an artifact.
# If the patched app fails to compile it builds the plain app instead, so you always get an APK,
# and it prints the compiler errors in the run summary.
#
# To add features or fix bugs later: upload another patch zip, or edit this file.

name: Import and Build Halcyon

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      use_patches:
        description: "Apply the patch zips (turn off to build the plain app)"
        required: true
        default: true
        type: boolean
  push:
    paths:
      - "*.zip"
      - "source/**"
      - "patches/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: halcyon-import-build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
  USE_PATCHES: ${{ github.event.inputs.use_patches || 'true' }}

jobs:
  build:
    name: Import, patch and build (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository (zips + workflow only)
        uses: actions/checkout@v4

      - name: Import source zip (to build/, not the repo root)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          BASE_ZIP=""
          for z in ./*.zip source/*.zip patches/*.zip; do
            [ -f "$z" ] || continue
            names=$(unzip -Z1 "$z" 2>/dev/null || true)
            if grep -qE '(^|/)settings\.gradle\.kts$' <<< "$names"; then
              BASE_ZIP="$z"
              break
            fi
          done
          if [ -z "$BASE_ZIP" ]; then
            echo "::error::No Halcyon source zip found. Upload the Halcyon zip (it must contain settings.gradle.kts) to the repository root."
            exit 1
          fi
          echo "Base source: $BASE_ZIP"
          rm -rf "$RUNNER_TEMP/base" build
          mkdir -p "$RUNNER_TEMP/base"
          unzip -q "$BASE_ZIP" -d "$RUNNER_TEMP/base"
          ROOT=$(find "$RUNNER_TEMP/base" -maxdepth 3 -name settings.gradle.kts -printf '%d %h\n' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$ROOT" ]; then
            echo "::error::settings.gradle.kts not found after unzipping $BASE_ZIP"
            exit 1
          fi
          mkdir build
          cp -a "$ROOT/." build/
          echo "BASE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "BASE_ZIP=$BASE_ZIP" >> "$GITHUB_ENV"
          ls build | head -30

      - name: Apply patch zips
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPLIED=0
          if [ "$USE_PATCHES" != "true" ]; then
            echo "Patches are switched off for this run."
          else
            mapfile -t ZIPS < <(printf '%s\n' ./*.zip source/*.zip patches/*.zip | sort)
            for p in "${ZIPS[@]}"; do
              [ -f "$p" ] || continue
              [ "$p" = "$BASE_ZIP" ] && continue
              names=$(unzip -Z1 "$p" 2>/dev/null || true)
              if grep -qE '(^|/)settings\.gradle\.kts$' <<< "$names"; then continue; fi
              if ! grep -qE '(^|/)apply\.py$|(^|/)files/' <<< "$names"; then
                echo "Skipping $p (not a patch zip)"
                continue
              fi
              d="$RUNNER_TEMP/patch-$(basename "$p" .zip | tr ' ' '_')"
              rm -rf "$d"; mkdir -p "$d"
              unzip -q "$p" -d "$d"
              F=$(find "$d" -maxdepth 2 -type d -name files | head -1 || true)
              A=$(find "$d" -maxdepth 2 -type f -name apply.py | head -1 || true)
              if [ -n "$F" ]; then cp -a "$F/." build/; fi
              if [ -n "$A" ]; then python3 "$A" "$PWD/build"; fi
              APPLIED=$((APPLIED + 1))
              echo "Applied patch: $p"
            done
          fi
          echo "PATCHES_APPLIED=$APPLIED" >> "$GITHUB_ENV"
          echo "Patch zips applied: $APPLIED"

      - name: Application license provenance check
        continue-on-error: true
        working-directory: build
        run: python3 tools/check_licenses.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          if ! sdkmanager --channel=3 "platforms;android-37"; then
            echo "platforms;android-37 is unavailable from sdkmanager; using android-36 as a CI compatibility platform."
            sdkmanager "platforms;android-36"
            mkdir -p "$ANDROID_HOME/platforms/android-37"
            cp -a "$ANDROID_HOME/platforms/android-36/." "$ANDROID_HOME/platforms/android-37/"
            sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
          fi
          sdkmanager --channel=3 "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: build

      - name: Build APK (with patches)
        id: build
        continue-on-error: true
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ALLOW_DEBUG_SIGNED_RELEASE: "true"
        run: |
          cd build
          chmod +x ./gradlew
          TASK=":app:assembleDebug"
          if [ "$BUILD_TYPE" = "release" ]; then TASK=":app:assembleRelease"; fi
          set +e
          ./gradlew --no-daemon "$TASK" -PellaAbi=arm64-v8a --stacktrace 2>&1 | tee ../build.log
          exit "${PIPESTATUS[0]}"

      - name: Show compiler errors
        if: ${{ always() && steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo "## Build failed"
            echo "Patch zips applied: $PATCHES_APPLIED"
            echo
            echo '```'
            grep -E '^e: |error:|FAILED|What went wrong' build.log | head -60 || true
            echo '```'
            echo
            echo "The full log is attached to this run as **build-log**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fallback – build the plain app (patches failed to compile)
        id: fallback
        if: ${{ steps.build.outcome == 'failure' && env.PATCHES_APPLIED != '0' }}
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ALLOW_DEBUG_SIGNED_RELEASE: "true"
        run: |
          rm -rf build-base
          mkdir build-base
          cp -a "$BASE_ROOT/." build-base/
          cd build-base
          chmod +x ./gradlew
          TASK=":app:assembleDebug"
          if [ "$BUILD_TYPE" = "release" ]; then TASK=":app:assembleRelease"; fi
          set +e
          ./gradlew --no-daemon "$TASK" -PellaAbi=arm64-v8a --stacktrace 2>&1 | tee ../build-base.log
          exit "${PIPESTATUS[0]}"

      - name: List APK outputs
        if: ${{ always() }}
        shell: bash
        run: |
          find build build-base -path '*outputs*' \( -name '*.apk' -o -name '*.APK' \) -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload APK (patched app)
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-visualizer-arm64-v8a-${{ github.run_number }}
          path: |
            build/app/build/outputs/apk/debug/*arm64-v8a*.apk
            build/app/build/outputs/apk/release/*arm64-v8a*.apk
            build/app/build/outputs/renamed-apk/debug/*arm64-v8a*.APK
            build/app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
          if-no-files-found: error

      - name: Upload APK (plain fallback app)
        if: ${{ steps.fallback.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-PLAIN-fallback-arm64-v8a-${{ github.run_number }}
          path: |
            build-base/app/build/outputs/apk/debug/*arm64-v8a*.apk
            build-base/app/build/outputs/apk/release/*arm64-v8a*.apk
            build-base/app/build/outputs/renamed-apk/debug/*arm64-v8a*.APK
            build-base/app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
          if-no-files-found: error

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build-base.log
          if-no-files-found: ignore

      - name: Mark the run as failed when the patched build did not compile
        if: ${{ steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::The patched app did not compile. A plain fallback APK was built if possible; send the errors from the run summary / build-log artifact."
          exit 1
